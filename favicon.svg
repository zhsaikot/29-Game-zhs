<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#1E314D"/>
      <stop offset="50%" stop-color="#0F1826"/>
      <stop offset="100%" stop-color="#05080E"/>
    </radialGradient>
    
    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#855B09"/>
    </linearGradient>

    <!-- Spade Body Gold Gradient -->
    <linearGradient id="goldSpade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="28%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#926207"/>
    </linearGradient>

    <!-- Luxury Shadows and Highlights -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Outer Base -->
  <rect x="18" y="18" width="476" height="476" rx="118" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="20"/>
  
  <!-- Subtle Inner Glass Ring -->
  <rect x="40" y="40" width="432" height="432" rx="98" fill="none" stroke="rgba(168,199,250,0.22)" stroke-width="3"/>

  <!-- Spade Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 230) scale(1.36)">
    <!-- Golden Ace of Spades Body -->
    <path d="M 0 -118 C -48 -46 -112 12 -112 68 C -112 105 -78 134 -36 134 C -15 134 6 118 14 100 C 10 126 3 150 -18 160 L 18 160 C -3 150 -10 126 -14 100 C -6 118 15 134 36 134 C 78 134 112 105 112 68 C 112 12 48 -46 0 -118 Z" fill="url(#goldSpade)"/>
    
    <!-- Pure Vector Cutout for '29' (Independent of system fonts) -->
    <g fill="#090E17" transform="translate(0, 16)">
      <!-- Number 2 -->
      <path d="M1276 0H54Q75 181 181.5 340.5Q288 500 581 717Q760 850 810.0 919.0Q860 988 860 1050Q860 1117 810.5 1164.5Q761 1212 686 1212Q608 1212 558.5 1163.0Q509 1114 492 990L84 1023Q108 1195 172.0 1291.5Q236 1388 352.5 1439.5Q469 1491 675 1491Q890 1491 1009.5 1442.0Q1129 1393 1197.5 1291.5Q1266 1190 1266 1064Q1266 930 1187.5 808.0Q1109 686 902 540Q779 455 737.5 421.0Q696 387 640 332H1276Z" transform="translate(-76, 38) scale(0.061, -0.061)"/>
      <!-- Number 9 -->
      <path d="M102 329 507 380Q523 295 561.0 260.0Q599 225 654 225Q752 225 807 324Q847 397 867 633Q794 558 717.0 523.0Q640 488 539 488Q342 488 206.5 628.0Q71 768 71 982Q71 1128 140.0 1248.0Q209 1368 330.0 1429.5Q451 1491 634 1491Q854 1491 987.0 1415.5Q1120 1340 1199.5 1175.5Q1279 1011 1279 741Q1279 344 1112.0 159.5Q945 -25 649 -25Q474 -25 373.0 15.5Q272 56 205.0 134.0Q138 212 102 329ZM852 983Q852 1102 792.0 1169.5Q732 1237 646 1237Q565 1237 511.5 1176.0Q458 1115 458 993Q458 870 513.5 805.0Q569 740 652 740Q738 740 795.0 803.0Q852 866 852 983Z" transform="translate(-2, 38) scale(0.061, -0.061)"/>
    </g>
  </g>

  <!-- Golden Crown Ornament -->
  <g transform="translate(256, 62)" filter="url(#shadow)">
    <path d="M -40 -8 L -18 10 L 0 -18 L 18 10 L 40 -8 L 28 18 L -28 18 Z" fill="url(#goldRim)"/>
    <circle cx="0" cy="-22" r="5.5" fill="#FFFBEB"/>
    <circle cx="-42" cy="-10" r="4.5" fill="#FFFBEB"/>
    <circle cx="42" cy="-10" r="4.5" fill="#FFFBEB"/>
  </g>

  <!-- Bottom Playing Card Suit Quartet Accents -->
  <g transform="translate(256, 442)">
    <!-- Spade -->
    <path d="M -72 -10 C -76 -4 -83 1 -83 7 C -83 11 -79 14 -75 14 C -72 14 -70 12 -69 10 C -70 13 -71 15 -74 18 L -66 18 C -69 15 -70 13 -71 10 C -70 12 -68 14 -65 14 C -61 14 -57 11 -57 7 C -57 1 -64 -4 -68 -10 Z" fill="url(#goldRim)"/>
    <!-- Heart -->
    <path d="M -24 -6 c-4-8-15-5-15 3 c0 7 15 15 15 15 s15-8 15-15 c0-8-11-11-15-3 z" fill="#EF4444"/>
    <!-- Club -->
    <g transform="translate(24, 4)">
      <circle cx="0" cy="-10" r="5.5" fill="url(#goldRim)"/>
      <circle cx="-7" cy="-2" r="5.5" fill="url(#goldRim)"/>
      <circle cx="7" cy="-2" r="5.5" fill="url(#goldRim)"/>
      <path d="M -2 -2 L -5 9 L 5 9 L 2 -2 Z" fill="url(#goldRim)"/>
    </g>
    <!-- Diamond -->
    <polygon points="72,-8 84,4 72,16 60,4" fill="#EF4444"/>
  </g>
</svg>